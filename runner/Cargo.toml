[package]
name = "fleet-runner"
version = "0.1.0"
edition = "2024"

[dependencies]
a2a = { package = "a2a-lf", version = "0.4.2" }
a2a-server = { package = "a2a-server-lf", version = "0.5.3", default-features = false }
async-trait = "0.1"
async-stream = "0.3"
axum = "0.8"
chrono = "0.4"
futures = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
aws-config = { version = "1.13.3", features = ["behavior-version-latest"] }
aws-sdk-bedrockruntime = "1.156.0"

[profile.release]
strip = true
