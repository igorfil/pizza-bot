name = "System report"
description = "Collects CPU, memory and disk usage on this machine and summarizes it (us.anthropic.claude-haiku-5-5 on Bedrock)."
command = "uv run --quiet agent.py"
timeout_secs = 120

[input]
label = "Focus"
hint = "optional question, e.g. is memory ok? (leave empty for a general report)"
example = "anything to worry about?"

[env]
MODEL = "us.anthropic.claude-haiku-5-5"
